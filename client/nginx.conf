server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # Baseline security headers — safe for both prod and sandbox vhosts.
    # The sandbox vhost on the host adds X-Robots-Tag and the CSP separately.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sandbox-only owner endpoints exposed at the bare /admin prefix
    # (feedbackAdminRoutes in server/src/modules/feedback/admin-routes.ts).
    # Behind owner-token check on the API; the host-level nginx vhost adds
    # Basic Auth as a second layer.
    #
    # Scoped narrowly so client-side admin routes (/admin/templates,
    # /admin/settings/*, /admin/survey-templates, /admin/survey-config, etc.)
    # fall through to the SPA `try_files` block instead of hitting Fastify
    # and returning JSON 404s on hard refresh.
    location ~ ^/admin/(invites|feedback)(/|$) {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PWA service worker must never be cached by the browser — otherwise
    # clients get stuck on an old SW and never pick up new builds.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires off;
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # Workbox helper + manifest revalidate frequently.
    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # `index.html` must always be revalidated. Vite emits hashed filenames
    # for every JS/CSS chunk; the only file that points at those hashes is
    # this one. Cached `index.html` after a deploy → browser asks for a
    # chunk hash that no longer exists → "Failed to fetch dynamically
    # imported module". The router's `lazyWithRetry` wrapper recovers
    # from this in-tab, but preventing it at the source is cheaper.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires off;
    }

    # Vite-hashed assets are content-addressed → safe to cache forever.
    # Saves bandwidth + speeds up navigation; a deploy never serves stale
    # bytes because the filename itself changes.
    location /static/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}

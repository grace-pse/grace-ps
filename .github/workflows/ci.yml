name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: lint-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile=false
      - name: Prisma generate
        working-directory: server
        run: pnpm prisma generate
      - name: Typecheck — server
        working-directory: server
        run: pnpm exec tsc --noEmit
      - name: Typecheck — client
        working-directory: client
        run: pnpm exec tsc --noEmit
      - name: Lint — server
        working-directory: server
        run: pnpm lint
        continue-on-error: true
      - name: Lint — client
        working-directory: client
        run: pnpm lint
        continue-on-error: true

  prisma-validate:
    name: prisma-validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile=false
      - name: Prisma validate
        working-directory: server
        run: pnpm exec prisma validate

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build api image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          cache-from: type=gha,scope=grace-api
          cache-to: type=gha,mode=max,scope=grace-api
      - name: Build web image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: client/Dockerfile
          push: false
          cache-from: type=gha,scope=grace-web
          cache-to: type=gha,mode=max,scope=grace-web

name: Docker · Publish to GHCR

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/grace-pse/grace-api
  IMAGE_WEB: ghcr.io/grace-pse/grace-web

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push GHCR images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        target:
          - { name: api, file: ./docker/api.Dockerfile, image: ghcr.io/grace-pse/grace-api }
          - { name: web, file: ./docker/web.Dockerfile, image: ghcr.io/grace-pse/grace-web }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.target.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=GRACE ${{ matrix.target.name }}
            org.opencontainers.image.description=Open-source physical security risk assessment platform (NIS2-aligned)
            org.opencontainers.image.vendor=GRACE Maintainers
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.url=https://github.com/grace-pse/grace
            org.opencontainers.image.documentation=https://github.com/grace-pse/grace/blob/main/README.md
            org.opencontainers.image.source=https://github.com/grace-pse/grace

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.target.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

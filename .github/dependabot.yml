version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - pnpm
    groups:
      all-npm:
        patterns:
          - "*"
    ignore:
      - dependency-name: tailwindcss
        versions:
          - ">=4.0.0"
      - dependency-name: "@tailwindcss/*"
        versions:
          - ">=4.0.0"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    groups:
      all-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: /client
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - docker

# Dev overlay: mount source, use tsx/vite watch instead of prebuilt images.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
name: csmp-v2

services:
  api:
    image: node:20-bookworm-slim
    command: sh -c "apt-get update && apt-get install -y openssl && npm i -g pnpm@9 && cd /app && pnpm install && cd server && pnpm prisma generate && pnpm prisma migrate deploy && pnpm dev"
    working_dir: /app
    volumes:
      - ../:/app
      - /app/node_modules
      - /app/server/node_modules

  web:
    image: node:20-bookworm-slim
    command: sh -c "npm i -g pnpm@9 && cd /app && pnpm install && pnpm --filter=@csmp/client dev --host 0.0.0.0"
    working_dir: /app
    volumes:
      - ../:/app
      - /app/node_modules
      - /app/client/node_modules
    ports:
      - '5173:5173'
